[view.epoch_boundaries]
description = "The (epoch, L2 block) window each epoch occupies. For epochs 1105 to 1370 the start is EXACT: EpochManager counts L1 blocks, so epoch(l1) = 92 + (l1 - 16687937) // 7200 from epochLength/lastLengthUpdateBlock/lastLengthUpdateEpoch read at the tip, binary-searched to the first L2 block whose header l1BlockNumber reaches that L1 boundary. Verified against the contract: currentEpoch() returns E at the boundary block and E-1 at the block before it. Those rows carry boundary_source 'l1-exact' and unobserved_gap_blocks 0, and every epoch in that range gets a row whether or not anything was observed in it. Outside the range there is no exact table and start_block falls back to the FIRST OBSERVED Horizon event, which is at or after the true start, so events in that gap are attributed to the predecessor; those rows carry 'observed' and unobserved_gap_blocks is the width of that uncertainty in L2 blocks. Computing the boundary in L2 block space instead is wrong by a factor of ~48 and is the trap this view exists to avoid. See nightswatchhq/nuthatch#1116."

[view.lodestar_delegations]
description = "Delegation, undelegation and withdrawal events across Horizon staking and the pre-Horizon topics on the same proxy. The shape Lodestar's delegations cron and /api/delegation-events read. tokens is wei."

[view.lodestar_epochs]
description = "Per-epoch rewards, query fees and signal in Lodestar's SubgraphEpoch shape. Three of the value columns are defined to match the Graph Network subgraph's fields exactly rather than the raw event sums, and the difference is not cosmetic: signalled_tokens is gross signal MINUS curationTax and does NOT subtract burns (subtracting burns produced negative values in 81 of 266 epochs); query_fees_collected is tokensCollected minus tokensCurators minus a 1% protocol tax truncated PER EVENT, not on the epoch total. Boundaries are exact for epochs 1105 to 1370, derived from EpochManager's own L1 arithmetic and mapped into L2 block space (see epoch_boundaries), and observed from the currentEpoch the events carry outside that range. Every epoch except the newest is immutable at a pinned block. start_block/end_block are L2 blocks, so they are still not directly comparable with the subgraph's L1 EpochManager numbers even though they now derive from them. All amounts are wei."
