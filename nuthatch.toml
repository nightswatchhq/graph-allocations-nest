[nest]
name = "graph-allocations-nest"
chain = "arbitrum-one"
chain_id = 42161
rpc_urls = [
    "https://arb1.arbitrum.io/rpc",
    "https://arb-pokt.nodies.app",
]
schema_version = 1
block_timestamps = true

[[contracts]]
alias = "subgraph_service"
address = "0xb2bb92d0de618878e438b55d5846cfecd9301105"
start_block = 397492865
abi = "abis/subgraph-service.json"
events = [
    "AllocationCreated",
    "AllocationClosed",
    "AllocationResized",
    "LegacyAllocationMigrated",
    "IndexingRewardsCollected",
    "QueryFeesCollected",
]

[[contracts]]
alias = "curation"
address = "0x22d78fb4bc72e191c765807f8891b5e1785c8014"
start_block = 42449403
abi = "abis/curation.json"
events = [
    "Signalled",
    "Burned",
]

[[contracts]]
alias = "epochs"
address = "0x5a843145c43d328b9bb7a4401d94918f131bb281"
start_block = 42449227
abi = "abis/epochs.json"
# `EpochRun` is sparse (it fires only when somebody calls runEpoch) and carries no block range, so
# epoch *boundaries* are computed from `EpochLengthUpdate` plus arithmetic rather than read off an
# event. Both are needed: the length changes, and the run markers.
events = ["EpochRun", "EpochLengthUpdate"]

[[contracts]]
alias = "disputes"
address = "0x2fe023a575449acb698648ed21276293fa176f96"
start_block = 397492858
abi = "abis/disputes.json"
# The dispute lifecycle only. The contract emits 17 events; the parameter setters and ownership
# plumbing are real data we deliberately do not carry here.
events = [
    "IndexingDisputeCreated",
    "QueryDisputeCreated",
    "LegacyDisputeCreated",
    "DisputeAccepted",
    "DisputeRejected",
    "DisputeDrawn",
    "DisputeCancelled",
    "DisputeLinked",
]
